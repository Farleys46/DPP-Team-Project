services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: air_flight_db
    ports:
      - "5432:5432"

  openaq-service:
    build: 
      context: ./OpenAQ-fetcher
      dockerfile: dockerfile
    restart: always # To handle crashes/updates
    env_file: .env
    depends_on:
      - db

  opensky-service:
    build: 
      context: ./OpenSky-fetcher
      dockerfile: dockerfile
    env_file: .env
    depends_on:
      - db

  dashboard:
    build: 
      context: .
      dockerfile: dockerfile
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - db
  #pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - db

      