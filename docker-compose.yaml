services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: air_flight_db
    ports:
      - "5433:5432"

  openaq-service:
    build: 
      context: .
      dockerfile: OpenAQ-fetcher/dockerfile
    restart: always # To handle crashes/updates
    env_file: .env
    depends_on:
      - db

  opensky-service:
    build: 
      context: .
      dockerfile: OpenSky-fetcher/dockerfile
    env_file: .env
    depends_on:
      - db

  dashboard:
    build: 
      context: .
      dockerfile: dockerfile
    volumes:          
      - .:/app
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - db
  #pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    depends_on:
      - db

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      # host -> kafka (for tools running on your laptop)
      - "29092:29092"
    volumes:
      - kafka_data:/bitnami
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  consumer:
    build: .
    env_file:
      - .env
    depends_on:
      - kafka
      - db
    command: ["python", "-u", "kafka_consumer.py"]

volumes:
  kafka_data: