services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: air_flight_db
    ports:
      - "5432:5432"

    app:
      build: .
      depends_on:
        - db
      env_file:
        - .env
      restart: always